name: verify

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  # GitHub occasionally does not create a run for a push, which leaves main ahead of what is deployed and
  # no way to fix it but an empty commit. This makes the same pipeline — tests, browser suite, deploy —
  # runnable by hand against any ref.
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://manclient:manclient@127.0.0.1:5432/manclient
  DATABASE_DIRECT_URL: postgresql://manclient:manclient@127.0.0.1:5432/manclient
  AUTH_SECRET: ci-auth-secret-at-least-32-characters
  AUTH_URL: http://127.0.0.1:3000
  APP_URL: http://127.0.0.1:3000
  CARD_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
  INTERNAL_API_SECRET: ci-internal-secret-at-least-32-characters
  BOOKING_ACTION_SECRET: ci-booking-secret-at-least-32-characters
  TELEGRAM_BOT_USERNAME: manclient_ci_bot
  DEMO_OWNER_PASSWORD: ci-demo-owner-password
  DEMO_STAFF_PASSWORD: ci-demo-staff-password
  DEMO_AUTO_OWNER_PASSWORD: ci-demo-auto-owner-password

jobs:
  # Gates the deploy. Nothing here reaches outside the package registry.
  #
  # Runs on the project's own runner rather than on GitHub's machines. Every job here shares one runner,
  # so they execute one at a time and the pipeline takes about twice as long as it did on three parallel
  # hosted VMs.
  #
  # Postgres is the machine's own service, not a `services:` container: those are Linux containers, and
  # the runner is a Mac. It must be created with the C.UTF-8 collation that `postgres:16-alpine` used —
  # anything else changes sort order and case-insensitive Cyrillic search, and the tests would disagree
  # with production over which name comes first. Unlike a container it is not recreated per run; the
  # integration tests clean up after themselves and the browser suite reseeds, which is what makes a
  # long-lived database safe here.
  test:
    runs-on: [self-hosted, manclient]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.2 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Gates the deploy, and now does so unconditionally. The browser download used to be allowed to fail —
  # GitHub's runners answered 403 "not available in your location" from Playwright's CDN, and an outage in
  # somebody else's infrastructure should not hold up a release. On the project's own runner that trade no
  # longer holds: the first run there failed the download for a different reason and the escape hatch
  # turned a permanent condition into a green pipeline with the browser gate silently switched off, which
  # is how a release reached production without a single browser test behind it. A blocked deploy is
  # visible; a skipped gate is not.
  e2e:
    runs-on: [self-hosted, manclient]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.2 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      # No cache action: the runner keeps its own disk between runs, so the browser is already there and
      # this is a no-op except after a version bump. `--with-deps` is gone with it — it exists to apt-get
      # system libraries on Linux, and reaching for sudo is exactly what broke this step before.
      - run: pnpm exec playwright install chromium
      - run: pnpm playwright test

  # Deploys, waits for the build to actually finish, and only then asks the released instance whether it
  # is reachable over a working HTTPS with its secrets in place. Without the wait the job would go green
  # on a queued request and the probe would be answered by the previous version.
  deploy:
    needs: [test, e2e]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, manclient]
    env:
      PRODUCTION_URL: https://manclient.mubi.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.2 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy through Coolify and wait for the build
        run: pnpm deploy:coolify
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      - name: Probe the released instance
        run: pnpm probe:https -- --url "$PRODUCTION_URL" --wait 180
